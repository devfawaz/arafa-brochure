<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Arafa Homes Brochure</title>
<meta name="description" content="Interactive tri-fold brochure for Arafa Homes, serviced apartments in Kochi. Open it, turn it over, and switch between English and Arabic.">
<link rel="icon" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=Noto+Sans+Arabic:wght@500&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #141b38;
    --gold: #ae8126;
    --cream: #fbf5e9;
    --bg-top: #efe8db;
    --bg-mid: #ebe2d1;
    --bg-bottom: #e0d2bb;
    --ink: #141b38;
    --ink-soft: rgba(20, 27, 56, .62);
    --glass: rgba(255, 252, 246, .72);
    --glass-line: rgba(20, 27, 56, .10);
    --h: 560px;              /* panel height, set from the viewport in JS */
    --w: calc(var(--h) * .4444);
    --ease: cubic-bezier(.65, 0, .25, 1);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: "DM Sans", system-ui, sans-serif;
    color: var(--ink);
    overflow: hidden;
    background:
      radial-gradient(80% 55% at 30% 25%, rgba(255,255,255,.6), rgba(255,255,255,0) 70%),
      linear-gradient(180deg, var(--bg-top) 0%, var(--bg-mid) 55%, var(--bg-bottom) 100%);
    -webkit-font-smoothing: antialiased;
    touch-action: none;
  }
  .grain { position: fixed; inset: 0; opacity: .14; mix-blend-mode: multiply; pointer-events: none; z-index: 1;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5  0 0 0 0 .45  0 0 0 0 .4  0 0 0 .5 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }

  /* top bar */
  header {
    position: fixed; top: 0; left: 0; right: 0; z-index: 10;
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    padding: max(20px, env(safe-area-inset-top)) 24px 0;
  }
  .brand { display: flex; align-items: center; gap: 12px; font-size: 14px; }
  .brand img { height: 23px; width: auto; display: block; }
  .brand span { color: var(--ink-soft); padding-left: 12px; border-left: 1px solid var(--glass-line); }
  .seg {
    display: inline-flex; padding: 4px; border-radius: 999px; background: var(--glass);
    border: 1px solid var(--glass-line); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    box-shadow: 0 6px 24px rgba(40, 25, 5, .08);
  }
  .seg button {
    font: inherit; font-size: 14px; font-weight: 500; color: var(--ink-soft);
    border: 0; background: transparent; border-radius: 999px; padding: 8px 16px; cursor: pointer;
    transition: background .25s, color .25s;
  }
  .seg button[aria-pressed="true"] { background: var(--navy); color: #fff; }
  .seg button:lang(ar) { font-family: "Noto Sans Arabic", "DM Sans", sans-serif; }

  /* stage */
  .stage { position: fixed; inset: 0; z-index: 2; cursor: grab; touch-action: none; }
  .stage.dragging { cursor: grabbing; }
  .stage canvas { display: block; width: 100%; height: 100%; outline: none; }
  .loading { position: fixed; inset: 0; display: grid; place-items: center; z-index: 3; font-size: 13px; color: var(--ink-soft); transition: opacity .5s; pointer-events: none; }
  .loading.gone { opacity: 0; }

  /* bottom toolbar */
  .bar {
    position: fixed; left: 50%; bottom: max(24px, env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 10;
    display: flex; align-items: center; gap: 4px; padding: 6px; border-radius: 999px;
    background: var(--glass); border: 1px solid var(--glass-line);
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); box-shadow: 0 10px 30px rgba(40, 25, 5, .10);
  }
  .bar button {
    font: inherit; font-size: 14px; font-weight: 500; color: var(--ink);
    display: inline-flex; align-items: center; gap: 8px; white-space: nowrap;
    border: 0; background: transparent; border-radius: 999px; padding: 10px 16px; cursor: pointer;
    transition: background .2s;
  }
  .bar button:hover { background: rgba(20, 27, 56, .06); }
  .bar button.primary { background: var(--navy); color: #fff; }
  .bar button.primary:hover { background: #1f2850; }
  .bar svg { width: 18px; height: 18px; flex: none; }
  .bar button:disabled { opacity: .35; cursor: default; background: transparent; }
  .steps { display: flex; gap: 6px; padding: 0 8px; }
  .steps i { width: 6px; height: 6px; border-radius: 50%; background: rgba(20, 27, 56, .18); transition: background .3s, width .3s; }
  .steps i.on { width: 18px; border-radius: 3px; background: var(--gold); }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .bar .sep { width: 1px; height: 20px; background: var(--glass-line); margin: 0 2px; }
  button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

  .hint {
    position: fixed; left: 0; right: 0; bottom: calc(max(24px, env(safe-area-inset-bottom)) + 64px); z-index: 10;
    text-align: center; font-size: 13px; color: var(--ink-soft); pointer-events: none; transition: opacity .6s;
  }
  .hint.gone { opacity: 0; }
  footer {
    position: fixed; right: 24px; bottom: max(30px, env(safe-area-inset-bottom)); z-index: 10;
    font-size: 12px; color: var(--ink-soft);
  }
  @media (max-width: 720px) {
    header { padding: max(16px, env(safe-area-inset-top)) 16px 0; }
    .brand span { display: none; }
    footer { display: none; }
    .bar button { padding: 10px 12px; }
    .bar .label-long { display: none; }
  }
</style>
</head>
<body>
<div class="grain"></div>

<header>
  <div class="brand"><img src="img/logo.svg" alt="Arafa Homes" width="124" height="23"><span>Brochure</span></div>
  <div class="seg" role="group" aria-label="Language">
    <button type="button" data-lang="en" aria-pressed="true">English</button>
    <button type="button" data-lang="ar" lang="ar" aria-pressed="false">العربية</button>
  </div>
</header>

<main class="stage" id="stage">
  <canvas id="gl" tabindex="0" role="img" aria-label="Arafa Homes brochure, closed, front cover"></canvas>
</main>
<div class="loading" id="loading">Loading brochure…</div>

<p class="hint" id="hint">Tap the brochure to open it, one page at a time. Drag to look around.</p>

<nav class="bar" aria-label="Brochure controls">
  <button type="button" id="prevBtn" aria-label="Previous page" disabled>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
  </button>
  <div class="steps" aria-hidden="true"><i></i><i></i><i></i></div>
  <button type="button" class="primary" id="nextBtn">
    <span id="nextLabel">Open</span>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
  </button>
  <span class="sep" aria-hidden="true"></span>
  <button type="button" id="flipBtn">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 0 1 13.7-5.6L20 9"/><path d="M20 4v5h-5"/><path d="M20 12a8 8 0 0 1-13.7 5.6L4 15"/><path d="M4 20v-5h5"/></svg>
    <span class="label-long">Turn over</span>
  </button>
  <button type="button" id="resetBtn" aria-label="Reset view">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3"/></svg>
  </button>
</nav>
<p class="sr-only" id="status" aria-live="polite"></p>

<footer>Designed by Muhammed Fawaz · 2025</footer>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<script type="module" src="app.js"></script>
</body>
</html>
